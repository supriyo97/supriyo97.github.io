<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#3E63E8" />
      <stop offset="1" stop-color="#1E37A8" />
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="24" fill="url(#mark)" />

  <!-- Hairline inner edge, matching the borders used across the site -->
  <rect
    x="1"
    y="1"
    width="98"
    height="98"
    rx="23"
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity="0.24"
    stroke-width="2"
  />

  <text
    x="50"
    y="51"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
    font-size="60"
    font-weight="700"
    letter-spacing="-2"
    fill="#FFFFFF"
  >S</text>
</svg>
